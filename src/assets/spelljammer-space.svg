<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050718"/>
      <stop offset="0.48" stop-color="#111035"/>
      <stop offset="1" stop-color="#071c2c"/>
    </linearGradient>
    <radialGradient id="violet-nebula">
      <stop offset="0" stop-color="#a861db" stop-opacity=".72"/>
      <stop offset=".28" stop-color="#7044ba" stop-opacity=".46"/>
      <stop offset=".68" stop-color="#39266e" stop-opacity=".18"/>
      <stop offset="1" stop-color="#261b5d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-nebula">
      <stop offset="0" stop-color="#55d3e8" stop-opacity=".5"/>
      <stop offset=".36" stop-color="#2587ad" stop-opacity=".34"/>
      <stop offset=".76" stop-color="#143c68" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0c3154" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose-nebula">
      <stop offset="0" stop-color="#e85ea9" stop-opacity=".42"/>
      <stop offset=".36" stop-color="#9a387f" stop-opacity=".24"/>
      <stop offset="1" stop-color="#5b245d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starlight">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".18" stop-color="#c8f5ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7ddbef" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-cloud" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="soft-glow" x="-250%" y="-250%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="small-stars" width="190" height="170" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="23" r="1.1" fill="#fff" opacity=".82"/>
      <circle cx="71" cy="13" r=".7" fill="#bdefff" opacity=".64"/>
      <circle cx="124" cy="42" r="1.4" fill="#fff" opacity=".7"/>
      <circle cx="168" cy="25" r=".6" fill="#d7c9ff" opacity=".72"/>
      <circle cx="44" cy="83" r=".55" fill="#fff" opacity=".55"/>
      <circle cx="99" cy="103" r="1" fill="#8fddf3" opacity=".68"/>
      <circle cx="151" cy="79" r=".8" fill="#fff" opacity=".86"/>
      <circle cx="180" cy="126" r="1.25" fill="#dccdff" opacity=".58"/>
      <circle cx="27" cy="145" r=".72" fill="#c9f4ff" opacity=".8"/>
      <circle cx="79" cy="155" r=".48" fill="#fff" opacity=".7"/>
      <circle cx="137" cy="139" r=".66" fill="#fff" opacity=".62"/>
      <path d="M113 72h8M117 68v8" stroke="#fff" stroke-width=".8" opacity=".48"/>
    </pattern>
    <pattern id="dust" width="61" height="53" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="18" r=".38" fill="#fff" opacity=".48"/>
      <circle cx="41" cy="7" r=".3" fill="#cbeeff" opacity=".45"/>
      <circle cx="52" cy="39" r=".42" fill="#fff" opacity=".38"/>
      <circle cx="24" cy="47" r=".28" fill="#e8dcff" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#space)"/>

  <g filter="url(#soft-cloud)">
    <ellipse cx="245" cy="220" rx="470" ry="270" fill="url(#violet-nebula)" transform="rotate(-18 245 220)"/>
    <ellipse cx="1380" cy="245" rx="510" ry="285" fill="url(#cyan-nebula)" transform="rotate(14 1380 245)"/>
    <ellipse cx="935" cy="960" rx="620" ry="300" fill="url(#rose-nebula)" transform="rotate(-7 935 960)"/>
    <ellipse cx="690" cy="420" rx="360" ry="150" fill="url(#violet-nebula)" opacity=".3" transform="rotate(22 690 420)"/>
  </g>

  <path d="M-80 710C230 480 410 650 690 480S1200 300 1690 80" fill="none" stroke="#8e65cc" stroke-width="84" opacity=".06" filter="url(#soft-cloud)"/>
  <path d="M-90 785C260 555 440 720 720 545S1220 380 1680 165" fill="none" stroke="#58c2d8" stroke-width="34" opacity=".07" filter="url(#soft-cloud)"/>

  <rect width="1600" height="1000" fill="url(#dust)"/>
  <rect width="1600" height="1000" fill="url(#small-stars)"/>

  <g fill="#fff">
    <g transform="translate(238 346)">
      <circle r="25" fill="url(#starlight)"/>
      <circle r="2.3"/>
      <path d="M-19 0h38M0-19v38" stroke="#dffaff" stroke-width="1.2" opacity=".85"/>
    </g>
    <g transform="translate(1314 565)">
      <circle r="21" fill="url(#starlight)"/>
      <circle r="1.9"/>
      <path d="M-16 0h32M0-16v32" stroke="#e7faff" stroke-width="1" opacity=".8"/>
    </g>
    <g transform="translate(1024 138)">
      <circle r="2.1"/>
      <path d="M-13 0h26M0-13v26" stroke="#efe8ff" stroke-width=".9" opacity=".72"/>
    </g>
    <g transform="translate(622 820)">
      <circle r="1.8"/>
      <path d="M-11 0h22M0-11v22" stroke="#dff9ff" stroke-width=".8" opacity=".65"/>
    </g>
  </g>

  <g filter="url(#soft-glow)" fill="#8fe9ff" opacity=".7">
    <circle cx="111" cy="608" r="3"/>
    <circle cx="475" cy="116" r="2.5"/>
    <circle cx="855" cy="640" r="2.8"/>
    <circle cx="1488" cy="184" r="3.1"/>
    <circle cx="1445" cy="862" r="2.6"/>
  </g>
</svg>
