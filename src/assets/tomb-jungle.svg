<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="jungle-ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#203b2a"/>
      <stop offset=".12" stop-color="#58704a"/>
      <stop offset=".27" stop-color="#c3b989"/>
      <stop offset=".5" stop-color="#e7dec1"/>
      <stop offset=".73" stop-color="#c6ba88"/>
      <stop offset=".88" stop-color="#5b734a"/>
      <stop offset="1" stop-color="#203a29"/>
    </linearGradient>
    <radialGradient id="sunlit-clearing" cx="50%" cy="40%" r="58%">
      <stop offset="0" stop-color="#f1e9cf" stop-opacity=".94"/>
      <stop offset=".58" stop-color="#e0d5af" stop-opacity=".62"/>
      <stop offset="1" stop-color="#867d54" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66854c"/>
      <stop offset="1" stop-color="#294f35"/>
    </linearGradient>
    <linearGradient id="leaf-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#365e3b"/>
      <stop offset="1" stop-color="#173426"/>
    </linearGradient>
    <linearGradient id="leaf-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9a55"/>
      <stop offset="1" stop-color="#4f6e3d"/>
