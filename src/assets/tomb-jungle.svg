      <path d="M25 43l4 3" stroke="#826f43" stroke-width=".6" opacity=".09"/>
    </pattern>
    <filter id="leaf-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dy="7" result="offset-blur"/>
      <feColorMatrix in="offset-blur" type="matrix" values="0 0 0 0 0.06 0 0 0 0 0.15 0 0 0 0 0.10 0 0 0 .34 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="leaf">
