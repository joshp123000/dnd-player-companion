      <path d="M4-4C34-39 63-76 96-116" fill="none" stroke="#8da265" stroke-width="3" opacity=".52"/>
      <path d="M33-39L17-79M51-59L42-99M66-78L65-112M34-40L70-37M51-60L86-55M68-79L99-72" fill="none" stroke="#79945b" stroke-width="1.6" opacity=".4"/>
    </g>
