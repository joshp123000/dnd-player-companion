      <path d="M5-1C29-5 55-8 83-9" fill="none" stroke="#c3c77b" stroke-width="2" opacity=".48"/>
      <path d="M35-5L24-22M53-7L49-27M68-8L70-22M33-3L19 11M54-6L43 13M70-8L64 5" fill="none" stroke="#b4bd72" stroke-width="1.2" opacity=".34"/>
    </g>
    <g id="broad-leaf">
